<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý SV</title>
    <!-- Nhúng Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <!-- Tiêu đề lớn -->
        <div class="text-center mb-5">
            <h1 class="fw-bold text-primary">HỆ THỐNG QUẢN LÝ SINH VIÊN</h1>
        </div>

        <!-- Khởi đầu Row để chia cột trái (Form) và phải (Table) -->
        <div class="row">

            <!-- KHU VỰC 1: FORM NHẬP LIỆU (Chiếm 4/12 cột trên màn hình lớn) -->
            <div class="col-lg-4 col-md-5 mb-4">
                <div class="card shadow border-0">
                    <div class="card-body">
                        <h4 class="card-title text-secondary mb-4">Thêm Sinh Viên Mới</h4>

                        <form id="SinhVien">
                            <!-- Ô nhập Tên -->
                            <div class="mb-3">
                                <label for="ten" class="form-label">Họ và Tên:</label>
                                <input type="text" class="form-control" id="ten" placeholder="Ví dụ: Nguyễn Văn A"
                                    required>
                            </div>

                            <!-- Ô nhập Tuổi -->
                            <div class="mb-3">
                                <label for="tuoi" class="form-label">Tuổi:</label>
                                <input type="number" class="form-control" id="tuoi" placeholder="Nhập từ 18 - 100"
                                    min="18" max="100" required>
                            </div>

                            <!-- Ô nhập MSSV -->
                            <div class="mb-3">
                                <label for="maSV" class="form-label">Mã Số Sinh Viên:</label>
                                <input type="text" class="form-control" id="maSV" placeholder="Nhập mã số SV" required>
                            </div>

                            <!-- Ô nhập Điểm trung bình -->
                            <div class="mb-3">
                                <label for="diemTB" class="form-label">Điểm Trung Bình:</label>
                                <input type="number" step="0.1" class="form-control" id="diemTB"
                                    placeholder="Nhập từ 1.0 - 10" min="0" max="10" required>
                            </div>

                            <!-- Ô nhập Email -->
                            <div class="mb-3">
                                <label for="mail" class="form-label">Email:</label>
                                <input type="email" class="form-control" id="mail" placeholder="name@example.com"
                                    required>
                            </div>
                            <button type="submit" id="btnSave" class="btn btn-primary w-100 py-2">
                                <i class="align-middle"></i> Lưu Sinh Viên
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- KHU VỰC 2: DANH SÁCH SINH VIÊN (Chiếm 8/12 cột trên màn hình lớn) -->
            <div class="col-lg-8 col-md-7 mb-4">
                <div class="card shadow border-0">
                    <div class="card-body">
                        <h4 class="card-title text-secondary mb-4">Danh Sách Sinh Viên</h4>
                        <div class="table-responsive">
                            <table class="table table-striped table-hover align-middle">
                                <thead class="table-dark">
                                    <tr>
                                        <th>ID</th>
                                        <th>Họ và Tên</th>
                                        <th>Tuổi</th>
                                        <th>Mã Sinh Viên</th>
                                        <th>Điểm TB</th>
                                        <th>Email</th>
                                        <th class="text-center">Hành động</th>
                                    </tr>
                                </thead>
                                <tbody id="studentTableBody">
                                    <!-- Dữ liệu mẫu kiểm tra giao diện -->
                                    <tr>
                                        <td>1</td>
                                        <td class="fw-bold">Nguyễn Văn A</td>
                                        <td>20</td>
                                        <td>225699271</td>
                                        <td>10.0</td>
                                        <td>nva@gmail.com</td>
                                        <td class="text-center">
                                            <button class="btn btn-danger btn-sm">Xóa</button>
                                        </td>
                                    </tr>
                                </tbody>


                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div> <!-- Kết thúc Row -->
    </div> <!-- Kết thúc Container -->

    <!-- Nhúng Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
